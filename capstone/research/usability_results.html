<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capstone Proposal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/TextPlugin.min.js"></script>

    <style>
        body {
            margin: 10vmin 15vmax;
            font-family: 'Instrument Serif';
            font-size: 16pt;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            color: #D6E4C8;
        }

        div {
            display: flex;
            gap: 20px;
        }

        p {
            width: 400px;
        }

        .review-col {
            display: flex;
            flex-direction: column;
            width: 400px;
            gap: 16px;
        }

        .review-col p {
            width: 100%;
            margin: 0;
        }

        .review-video {
            width: 100%;
            border-radius: 6px;
            display: block;
            outline: none;
        }
    </style>
</head>

<body>
    <h1></h1>
    <div>
        <div class="review-col">
            <video class="review-video" src="usertest1.mov" autoplay muted loop playsinline></video>
            <p id="p1"></p>
        </div>
        <div class="review-col">
            <video class="review-video" src="usertest2.mov" autoplay muted loop playsinline></video>
            <p id="p2"></p>
        </div>
        <div class="review-col">
            <video class="review-video" src="usertest3.mov" autoplay muted loop playsinline></video>
            <p id="p3"></p>
        </div>
    </div>
</body>

<script>
    (function () {
        gsap.registerPlugin(TextPlugin);
        const text = "usability results";
        const textElement = document.querySelector("h1");
        gsap.to(textElement, {
            duration: 2,
            text: text,
            ease: "none"
        });

        const p_texts = [
            "SABI - Found the concept and interface intuitive to use. The animations elements were engaging, but the interactive hover effects were not as intuitive and felt more like a novelty than a meaningful interaction. Confused about the perspective (who is the &quot;you&quot; in the poem? Is it the reader or the speaker?) but overall understood the themes of the poem. Said &quot;Each line is so impactful, I don't know which part to leave with (optimistic or pessimistic)&quot;. I plan to change the wording of the poem to use either exclusively &quot;you&quot; or &quot;we&quot; to make the perspective clearer.",

            "KARLEY - Really loved the variety of animations, but found some of the color choices difficult to read for certain words. Noted that the cursor type made it seem like elements were clickable when they were not, which was a bit confusing. Felt the message about purpose and self worth fit well with the theme of the future. Said &quot;I came away from it feeling good about myself!&quot; I plan to change the cursor type to a default pointer when hovering over text, and to make the colors for the text more easily readable.",

            "GIANG - Noted the cursor should remain a pointer and not switch to a highlighter over the text, and that the animations should be more relevant to the meaning of each line. Loved the color changes and how they emphasized the ending line, wished that other words on different lines were also emphasized in some way. Said the dark color made it feel sad, but &quot;the light color was uplifting. It took me through a journey.&quot; I plan to make the animations more relevant to the meaning of each line, and to add more emphasis to certain words throughout the poem, not just the ending line."
        ]

        let index = 0;
        const paragraphs = document.querySelectorAll("p");
        paragraphs.forEach((paragraph) => {
            gsap.to(paragraph, {
                duration: 10,
                delay: 2 + index * 0.5,
                opacity: 1,
                ease: "power2.out",
                text: p_texts[index++]
            })
        });
    })();
</script>

</html>
