        <i class="fas fa-volume-mute"></i>
    </section>
    <section id="poem">
        <p id="line1" class="hidden">the earth has guilt, the earth has care,</p>
        <p id="line2" class="hidden">unquiet are its graves;</p>
        <p id="line3" class="hidden">but peaceful sleep is ever there,</p>
        <p id="line4" class="hidden">beneath the dark blue waves.</p>
        <p id="line5" class="hidden">nathaniel hawthorne</p>
    </section>
